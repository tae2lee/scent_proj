<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RESCENE ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F3; --card:#FFFFFF; --ink:#141414; --sub:#77756F; --line:#E6E4DF; --soft:#F0EFEB;
  --r-card:18px; --r-box:12px; --r-btn:10px;
  --font:"Pretendard","Pretendard JP","Inter","Noto Sans KR","Noto Sans JP","Noto Sans SC",system-ui,-apple-system,sans-serif;
}
html:lang(ja){--font:"Pretendard JP","Inter","Noto Sans JP","Noto Sans KR","Noto Sans SC",system-ui,sans-serif}
html:lang(zh){--font:"Inter","Noto Sans SC","Noto Sans KR","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

header{padding:36px 0 18px}
header .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.logo{font-weight:800;font-size:44px;letter-spacing:-0.04em;line-height:1}
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-btn);padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.lang-btn .caret{font-size:9px;color:var(--sub)}
.lang-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:var(--r-box);padding:6px;min-width:160px;box-shadow:0 10px 28px rgba(0,0,0,.07);display:none;z-index:30}
.lang.open .lang-menu{display:block}
.lang-menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;text-align:left}
.lang-menu button:hover,.lang-menu button.on{background:var(--soft)}
.lang-menu .code{font-weight:700;width:24px}
.lang-menu .nm{color:var(--sub)}

nav{position:sticky;top:0;z-index:20;background:rgba(245,245,243,.94);backdrop-filter:blur(10px);padding:10px 0;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-box);padding:4px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;color:var(--sub)}
.seg button.on{background:var(--ink);color:#fff}

main.wrap{padding-top:22px;padding-bottom:80px}
section{display:none}
section.on{display:block}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:var(--r-btn);cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.pill.ghost{background:transparent}
a.pill:hover,button.pill:hover{border-color:#bdbab3}
.note{font-size:12px;color:var(--sub)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}

/* album grid */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:16px}
.tile{display:flex;flex-direction:column;justify-content:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:10px 10px 14px;cursor:pointer;text-align:left;transition:box-shadow .15s, transform .15s}
.tile:hover{box-shadow:0 8px 24px rgba(0,0,0,.06);transform:translateY(-2px)}
.cover{aspect-ratio:1/1;border-radius:var(--r-box);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:var(--soft)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{display:flex;flex-direction:column;align-items:center;gap:10px;color:rgba(20,20,20,.55);font-size:11px;font-weight:600}
.cover .ph svg{width:44px;height:44px;opacity:.85}
.tile .info{padding:12px 4px 0}
.tile .t{font-size:17px;font-weight:700;letter-spacing:-0.02em;line-height:1.25}
.tile .k{font-size:12px;color:var(--sub);margin-top:2px}
.tile .chips{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;background:var(--soft);border-radius:6px;padding:3px 8px;display:inline-flex;align-items:center;gap:5px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,20,20,.4);display:none;align-items:flex-start;justify-content:center;padding:32px 14px;z-index:50;overflow:auto}
.modal.on{display:flex}
.sheet{background:var(--bg);border-radius:22px;max-width:720px;width:100%;overflow:hidden;position:relative}
.sheet .top{padding:22px;display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:start;background:var(--card);border-bottom:1px solid var(--line)}
.sheet .top .cover{width:180px}
.sheet .top .k{font-size:13px;color:var(--sub);font-weight:600}
.sheet .top .t{font-size:32px;font-weight:800;letter-spacing:-0.03em;line-height:1.1;margin-top:2px}
.sheet .top p{margin:10px 0 0;font-size:14px}
.x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:17px;z-index:2}
.sheet .body{padding:16px 22px 24px;display:grid;gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
.box h4{margin:0 0 8px;font-size:13px;color:var(--sub);font-weight:700}
.trk{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.trk:first-of-type{border-top:0}
.trk .n{width:20px;color:var(--sub);font-weight:600;font-size:13px}
.trk .nm{flex:1;min-width:150px;font-weight:600}
.trk .nm a:hover{text-decoration:underline}
.trk .nm .play{display:inline-block;width:22px;height:22px;border-radius:7px;background:var(--ink);color:#fff;font-size:9px;line-height:22px;text-align:center;margin-right:8px;vertical-align:1px}
.badge{font-size:10px;font-weight:800;background:var(--ink);color:#fff;padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:2px}
.trk .sub{font-size:12px;color:var(--sub);margin-left:6px;font-weight:500}
.upl{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.upl input{display:none}
@media (max-width:560px){.sheet .top{grid-template-columns:1fr}.sheet .top .cover{width:140px}.logo{font-size:32px}}

/* schedule */
.month{font-size:20px;font-weight:800;margin:26px 0 10px;letter-spacing:-0.02em}
.ev{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;display:grid;grid-template-columns:58px 1fr;gap:14px;margin-bottom:8px}
.ev .day{text-align:center;border-radius:var(--r-box);padding:8px 0;background:var(--soft);height:max-content}
.ev .day b{display:block;font-size:20px;line-height:1.1}
.ev .day span{font-size:11px;color:var(--sub);font-weight:600}
.ev .ttl{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev .pl{font-size:13px;color:var(--sub);margin-top:2px}
.ev .tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;background:var(--soft);border-radius:6px;padding:2px 8px;font-weight:500}
.cat{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;display:inline-flex;align-items:center;gap:5px;background:var(--soft)}
.ev .win{margin-top:6px;font-size:13px;font-weight:700;background:var(--soft);border-radius:8px;padding:5px 10px;display:inline-block}
.ev .acts{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}

/* members */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.mem{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:12px}
.mem .nm{font-size:26px;font-weight:800;letter-spacing:-0.03em;line-height:1;display:flex;align-items:center;gap:8px}
.mem .en{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.06em;margin-top:6px}
.mem .home{font-size:12px;color:var(--sub)}
.mem .grp{display:grid;gap:6px;margin-top:auto}
.mem .grp a{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:var(--r-btn);padding:9px 12px;font-size:13px;font-weight:600}
.mem .grp a:hover{background:#e7e5e0}

/* scent */
.shead{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;margin:14px 0;display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center}
.shead .lbl{font-size:12px;color:var(--sub);font-weight:600}
.shead .nm{font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-0.03em}
.shead p{margin:8px 0 0;font-size:14px}
.vstatus{font-size:13px;color:var(--sub);margin:4px 0 12px}
.cands{display:grid;gap:8px}
.cand{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;position:relative;overflow:hidden}
.cand.mine{border-color:var(--ink)}
.cand .bar{position:absolute;left:0;top:0;bottom:0;background:var(--tint,#eee);opacity:.22;z-index:0;transition:width .4s}
.cand > *:not(.bar){position:relative;z-index:1}
.cand .tp{display:flex;gap:12px;align-items:flex-start}
.cand .rank{font-size:18px;font-weight:800;width:24px;color:var(--sub)}
.cand .info{flex:1;min-width:0}
.cand .br{font-size:12px;color:var(--sub);font-weight:600}
.cand .pn{font-weight:700;font-size:16px}
.cand .why{font-size:13px;margin-top:6px}
.cand .notes{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.cand .notes span{font-size:11px;background:var(--soft);padding:2px 8px;border-radius:6px;font-weight:500}
.cand .side{text-align:right;min-width:84px}
.cand .cnt{font-size:20px;font-weight:800;line-height:1.1}
.cand .pct{font-size:12px;color:var(--sub)}
.vote{margin-top:8px;border:1px solid var(--ink);background:var(--card);font-size:13px;font-weight:700;padding:6px 12px;border-radius:var(--r-btn);cursor:pointer}
.vote.on{background:var(--ink);color:#fff}
.vote:disabled{opacity:.35;cursor:default}
.by{font-size:11px;color:var(--sub);margin-top:4px;font-weight:600}
.memos{margin-top:8px;display:grid;gap:4px}
.memos q{font-size:12px;color:var(--sub)}
.memo{display:flex;gap:6px;margin-top:10px}
.memo input{flex:1}
input[type=text]{font:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r-btn);padding:9px 12px;color:var(--ink);width:100%}
.nom{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px}
.nom summary{cursor:pointer;font-weight:700}
.nom form{display:grid;gap:10px;margin-top:12px}
.nom label{font-size:12px;color:var(--sub);display:block;margin:0 0 4px 2px;font-weight:600}
.btn{border:0;background:var(--ink);color:#fff;font-weight:700;padding:10px 16px;border-radius:var(--r-btn);cursor:pointer;display:inline-block}
.btn:disabled{opacity:.35}
.row2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:560px){.row2{grid-template-columns:1fr}.shead{grid-template-columns:84px 1fr}}

/* horizontal timeline */
.tl-nav{display:flex;flex-direction:column;gap:8px}
.tl-years{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap}
.tl-years .yr{border:0;background:none;cursor:pointer;font-family:"Oswald",var(--font);font-weight:700;font-size:40px;line-height:1;color:#c9c6bf;padding:0 8px 0 0;letter-spacing:-0.01em}
.tl-years .yr.on{color:#141414}
.tl-years .yr.up{font-family:var(--font);font-size:18px;font-weight:800;padding-bottom:5px;margin-left:8px}
.tl-months{display:flex;gap:4px;flex-wrap:wrap;min-height:30px}
.tl-months .mo{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--sub)}
.tl-months .mo.on{background:#2A2A28;border-color:#2A2A28;color:#fff}
.tl-wrap{position:relative;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.tl{overflow-x:auto;overflow-y:hidden;cursor:grab;scrollbar-width:thin;outline:none;-webkit-overflow-scrolling:touch}
.tl.dragging{cursor:grabbing;user-select:none}
.tl.dragging .tl-ev{pointer-events:none}
.tl-inner{position:relative}
.tl-band{position:absolute;left:0;top:238px;height:84px;background:#2A2A28}
.tl-band.up{background:repeating-linear-gradient(135deg,#8E8C86 0 10px,#9D9B95 10px 20px)}
.tl-year{position:absolute;top:18px;font-family:"Oswald",var(--font);font-weight:700;font-size:56px;line-height:1;color:#141414;letter-spacing:-0.01em;pointer-events:none}
.tl-month{position:absolute;top:244px;color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;pointer-events:none;padding-left:6px;border-left:2px solid rgba(255,255,255,.8);height:72px}
.tl-today{position:absolute;top:90px;bottom:20px;border-left:2px dashed #141414;pointer-events:none}
.tl-today span{position:absolute;top:-2px;left:6px;font-size:11px;font-weight:800;background:#141414;color:#fff;border-radius:6px;padding:2px 7px;white-space:nowrap}
.tl-ev{position:absolute;width:228px;border:0;background:none;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;font:inherit;color:inherit}
.tl-ev.top{bottom:238px;justify-content:flex-end}
.tl-ev.bot{top:238px}
.tl-num{font-family:"Oswald",var(--font);font-weight:700;font-size:38px;line-height:42px;height:84px;color:#fff;display:block;letter-spacing:.01em}
.tl-ev.top .tl-num{order:2}
.tl-card{display:flex;flex-direction:column;gap:3px;padding:10px 6px 10px 0;max-width:212px}
.tl-ev.top .tl-card{padding:0 6px 10px 0}
.tl-meta{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.02em;text-transform:uppercase}
.tl-uni{color:var(--sub);font-weight:700}
.tl-win{font-size:12px}
.tl-ttl{font-weight:800;font-size:15px;line-height:1.25;letter-spacing:-0.02em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl-pl{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-th{width:30px;height:30px;border-radius:7px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;margin-top:4px}
.tl-th img{width:100%;height:100%;object-fit:cover}
.tl-th svg{width:16px;height:16px;opacity:.75}
.tl-org{align-self:flex-start;margin-top:4px;font-size:10px;font-weight:800;letter-spacing:.06em;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--sub)}
.tl-ev:hover .tl-ttl{text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:#141414}
.tl-ev.up .tl-card{opacity:.75}
.tl-ev.up .tl-num{color:#fff}
.tl-arrow{position:absolute;top:258px;z-index:3;width:40px;height:44px;border:0;background:rgba(255,255,255,.92);font-size:26px;line-height:1;cursor:pointer;color:#141414;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tl-arrow.l{left:0;border-radius:0 10px 10px 0}
.tl-arrow.r{right:0;border-radius:10px 0 0 10px}
@media (hover:none){.tl-arrow{display:none}}
.evtop{padding:24px 22px;display:grid;grid-template-columns:92px 1fr;gap:18px;background:var(--card);border-bottom:1px solid var(--line)}
.evnum{background:#2A2A28;color:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0;font-family:"Oswald",var(--font);font-size:36px;line-height:1.05;height:max-content}
.evtop .k{font-size:13px;color:var(--sub);font-weight:600}
.evtop .t{font-size:26px;font-weight:800;letter-spacing:-0.03em;line-height:1.15;margin-top:4px;padding-right:30px}
.evtop p{margin:6px 0 0;font-size:14px;color:var(--sub)}
.evtop .win{margin-top:8px;font-size:13px;font-weight:700;background:var(--soft);border-radius:8px;padding:5px 10px;display:inline-block}
.hm{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hm-item{display:inline-flex;align-items:center;gap:2px}
.hm-del{border:0;background:none;color:var(--sub);cursor:pointer;font-size:15px}
.hm-form{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.hm-form input{width:160px}
.hm-form select{font:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r-btn);padding:7px 10px}
footer{padding:0 0 40px;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="logo">RESCENE ARCHIVE</div>
  <div class="lang" id="lang">
    <button class="lang-btn" id="langBtn" aria-haspopup="listbox"><span id="langFlag">🇰🇷</span><span id="langCode">ko</span><span class="caret">▼</span></button>
    <div class="lang-menu" id="langMenu" role="listbox"></div>
  </div>
</div></header>

<nav><div class="wrap"><div class="seg" id="tabs"></div></div></nav>

<main class="wrap">
  <section id="albums">
    <div class="row" id="albumFilters"></div>
    <div class="tiles" id="tiles"></div>
  </section>

  <section id="schedule">
    <div class="tl-nav">
      <div class="tl-years" id="tlYears"></div>
      <div class="tl-months" id="tlMonths"></div>
    </div>
    <div class="row" id="schedCats" style="margin-top:12px"></div>
    <div class="tl-wrap">
      <button class="tl-arrow l" aria-label="previous">‹</button>
      <div class="tl" id="tl" tabindex="0"><div class="tl-inner" id="tlInner"></div></div>
      <button class="tl-arrow r" aria-label="next">›</button>
    </div>
    <p class="note" id="schedNote" style="margin-top:10px"></p>
  </section>

  <section id="members">
    <div class="mgrid" id="mgrid"></div>
  </section>

  <section id="scent">
    <div class="row" id="scentAlbums"></div>
    <div id="scentHead"></div>
    <div class="vstatus" id="vstatus"></div>
    <div class="cands" id="cands"></div>
    <details class="nom" id="nomBox">
      <summary data-i="nomSummary"></summary>
      <form id="nomForm">
        <div class="row2">
          <div><label data-i="fBrand"></label><input type="text" id="nBrand" maxlength="40" required></div>
          <div><label data-i="fName"></label><input type="text" id="nName" maxlength="60" required></div>
        </div>
        <div><label data-i="fNotes"></label><input type="text" id="nNotes" maxlength="80"></div>
        <div><label data-i="fWhy"></label><input type="text" id="nWhy" maxlength="120" required></div>
        <div class="row"><button class="btn" type="submit" data-i="fSubmit"></button><span class="note" id="nomMsg"></span></div>
      </form>
    </details>
    <p class="note" style="margin-top:16px" data-i="scentDisclaimer"></p>
  </section>
</main>

<footer><div class="wrap" data-i="footer"></div></footer>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ================= i18n ================= */
const LANGS = [
  {id:"ko", code:"ko", flag:"🇰🇷", name:"한국어", locale:"ko-KR"},
  {id:"en", code:"en", flag:"🇺🇸", name:"English", locale:"en-US"},
  {id:"zh", code:"ch", flag:"🇨🇳", name:"中文", locale:"zh-CN"},
  {id:"ja", code:"jp", flag:"🇯🇵", name:"日本語", locale:"ja-JP"}
];
const T = {
  tabAlbums:{ko:"앨범",en:"Albums",zh:"专辑",ja:"アルバム"},
  tabSchedule:{ko:"일정",en:"Schedule",zh:"日程",ja:"スケジュール"},
  tabMembers:{ko:"멤버",en:"Members",zh:"成员",ja:"メンバー"},
  tabScent:{ko:"향",en:"Scent",zh:"香气",ja:"香り"},
  albumsH:{ko:"앨범",en:"Albums",zh:"专辑",ja:"アルバム"},

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yt  = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
const ytm = q => "https://music.youtube.com/search?q=" + encodeURIComponent(q);
const fmt = d => d.replaceAll("-", ".");
const yymmdd = d => d.length === 10 ? d.slice(2).replaceAll("-", "") : "";
function weekday(d){
  if(d.length !== 10) return "";
  const [y,m,dd] = d.split("-").map(Number);
  return new Intl.DateTimeFormat(LOC(), {weekday:"short", timeZone:"UTC"}).format(new Date(Date.UTC(y, m-1, dd)));
}
function monthLabel(ym){
  const [y,m] = ym.split("-").map(Number);
  return new Intl.DateTimeFormat(LOC(), {year:"numeric", month:"long", timeZone:"UTC"}).format(new Date(Date.UTC(y, m-1, 1)));
}
const memberName = m => L(m.name);
let covers = {};          // albumId -> blob url
function coverHTML(r){
  const u = covers[r.id];
  if(u) return `<div class="cover"><img src="${esc(u)}" alt="${esc(r.title)} cover" loading="lazy"></div>`;
  return `<div class="cover" style="background:${r.color}55"><div class="ph">${icon(r.icon)}</div></div>`;
}

/* ================= language ================= */
function renderLangMenu(){
  const cur = LANGS.find(l => l.id === LANG);
  $("#langFlag").textContent = cur.flag; $("#langCode").textContent = cur.code;
  $("#langMenu").innerHTML = LANGS.map(l => `<button role="option" class="${l.id===LANG?"on":""}" data-l="${l.id}"><span>${l.flag}</span><span class="code">${l.code}</span><span class="nm">${l.name}</span></button>`).join("");
  $("#langMenu").querySelectorAll("[data-l]").forEach(b => b.onclick = () => { setLang(b.dataset.l); $("#lang").classList.remove("open"); });
}
$("#langBtn").onclick = e => { e.stopPropagation(); $("#lang").classList.toggle("open"); };
document.addEventListener("click", e => { if(!$("#lang").contains(e.target)) $("#lang").classList.remove("open"); });
function setLang(id){
  LANG = id;
  try { localStorage.setItem("rescene-lang", id); } catch(e){}
  document.documentElement.lang = id;
  renderAll();
}

/* ================= tabs ================= */
const TABS = [["albums","tabAlbums"],["schedule","tabSchedule"],["members","tabMembers"],["scent","tabScent"]];
let currentTab = "albums";
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([id,k]) => `<button data-tab="${id}" class="${id===currentTab?"on":""}">${t(k)}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { location.hash = b.dataset.tab; showTab(b.dataset.tab); });
}
function showTab(id){
  if(!TABS.some(x => x[0] === id)) id = "albums";
  currentTab = id;
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === id));
  if(id === "schedule" && tlFirst && $("#tlInner").innerHTML) renderSchedule();
  renderTabs();
}
window.addEventListener("hashchange", () => showTab(location.hash.slice(1)));

  $("#albumFilters").innerHTML = fs.map(([id,k]) => `<button class="pill ${id===albumFilter?"on":""}" data-f="${id}">${t(k)}</button>`).join("");
  $("#albumFilters").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { albumFilter = b.dataset.f; renderAlbums(); });
  const list = RELEASES.filter(r => albumFilter === "all" || r.f === albumFilter);
  $("#tiles").innerHTML = list.map(r => `<button class="tile" data-id="${r.id}">
      ${coverHTML(r)}
      <div class="info">
        <div class="t">${esc(r.title)}</div>
        <div class="k">${esc(L(r.kind))} · ${fmt(r.date)}</div>
        ${r.scent ? `<div class="chips"><span class="chip"><span class="dot" style="background:${r.color}"></span>${esc(L(r.scent))}</span></div>` : ""}
      </div>
    </button>`).join("");
  $("#tiles").querySelectorAll(".tile").forEach(el => el.onclick = () => openAlbum(el.dataset.id));
}
let stageSong = 0, openId = null;
function openAlbum(id, keep){

  openId = id; openEv = null;
  const r = relById(id);
  const clean = nm => nm.replace(/\s*\(.*\)/,"");
  const rows = r.tracks.map((tr, i) => {
    const [nm, isTitle, kw, sub, sp] = tr;
    const extras = [
      ...(isTitle ? [`<a class="pill sm" href="${yt("RESCENE " + clean(nm) + " Official MV")}" target="_blank" rel="noopener">${t("mv")}</a>`] : []),
      ...((sp || []).map(([k,q]) => `<a class="pill sm" href="${yt(q)}" target="_blank" rel="noopener">${t(k)}</a>`))

      <span class="n">${i+1}</span>

        <div class="k">${esc(L(r.kind))} · ${fmt(r.date)}</div>
        <div class="t">${esc(r.title)}</div>
        <p>${esc(L(r.desc))}</p>

    <div class="body">
      <div class="box">
        <h4>${t("tracks")}</h4>
        ${rows}

      </div>
      <div class="box">
        <h4>${t("findStage")}</h4>
        <div class="row">${r.tracks.map((tr, i) => `<button class="pill sm ${i===stageSong?"on":""}" data-song="${i}">${esc(tr[0])}</button>`).join("")}</div>
        <div class="row" style="margin-top:10px">
          <a class="pill" href="${yt(qAll)}" target="_blank" rel="noopener">${t("everyone")} ↗</a>
          ${MEMBERS.map(m => `<a class="pill" href="${yt(qMem(m))}" target="_blank" rel="noopener"><span class="dot" style="background:${m.color}"></span>${esc(memberName(m))} ↗</a>`).join("")}

function closeModal(){ $("#modal").classList.remove("on"); openId = null; openEv = null; }

/* ================= schedule: horizontal timeline ================= */
const ACCENT = "#2A2A28";
let tlFirst = true, tlCat = "all", hmItems = [], canEditHm = false, tlMarks = [], tlScrollKeep = null;
function todayStr(){ return new Date(Date.now() + 9*3600e3).toISOString().slice(0,10); }
function nextDay(d){ const [y,m,dd] = d.split("-").map(Number); return new Date(Date.UTC(y, m-1, dd+1)).toISOString().slice(0,10); }
function monthShort(ym){ const [y,m] = ym.split("-").map(Number); return new Intl.DateTimeFormat(LOC(), {month:"short", timeZone:"UTC"}).format(new Date(Date.UTC(y, m-1, 1))); }
const xs = q => "https://x.com/search?q=" + encodeURIComponent(q) + "&f=live";
function evThumb(e){
  if(e.org) return `<span class="tl-org">${esc(e.org)}</span>`;
  if(e.r){ const r = relById(e.r); if(!r) return "";
    return covers[r.id] ? `<span class="tl-th"><img src="${esc(covers[r.id])}" alt=""></span>` : `<span class="tl-th" style="background:${r.color}88">${icon(r.icon)}</span>`; }
  return "";
}
function renderSchedule(){
  const tl = $("#tl");
  const keep = tl ? tl.scrollLeft : null;
  const cats = ["all","release","broadcast","event","awards"];
  $("#schedCats").innerHTML = cats.map(c => `<button class="pill sm ${c===tlCat?"on":""}" data-c="${c}">${c==="all" ? t("all") : t(CAT_KEY[c])}</button>`).join("")
    + `<a class="pill sm ghost" style="margin-left:auto" href="https://artist.mnetplus.world/main/stg/rescene-official/schedule/2026/11" target="_blank" rel="noopener">${t("officialSched")} ↗</a>`;
  $("#schedCats").querySelectorAll("[data-c]").forEach(b => b.onclick = () => { tlCat = b.dataset.c; tlScrollKeep = "today"; renderSchedule(); });
  $("#schedNote").textContent = t("schedNote");

  const today = todayStr();
  const list = EVENTS.filter(e => tlCat === "all" || e.c === tlCat).slice().sort((a,b) => a.d.localeCompare(b.d));
  const COL = 150, H = 560;
  let x = 40, html = "", prevY = "", prevYM = "", todayX = null, n = 0;
  tlMarks = [];
  list.forEach(e => {
    const up = e.d > today;
    if(up && todayX === null){ x += 40; todayX = x - 30; tlMarks.push({key:"up", year:"up", x:todayX}); html += `<div class="tl-today" style="left:${todayX}px"><span>${t("today")}</span></div>`; }
    const y = e.d.slice(0,4), ym = e.d.slice(0,7);
    if(y !== prevY){ if(prevY) x += 60; html += `<div class="tl-year" style="left:${x}px">${y}</div>`; tlMarks.push({key:y, year:y, x}); prevY = y; prevYM = ""; }
    if(ym !== prevYM){ html += `<div class="tl-month" style="left:${x}px">${esc(monthShort(ym))}</div>`; tlMarks.push({key:ym, year:y, x, month:true, up}); prevYM = ym; x += 34; }
    const top = n++ % 2 === 0;
    const idx = EVENTS.indexOf(e);
    html += `<button class="tl-ev ${top?"top":"bot"} ${up?"up":""}" style="left:${x}px" data-ev="${idx}">
        ${top ? "" : `<span class="tl-num">${e.d.slice(5,7)}<br>${e.d.slice(8,10)}</span>`}
        <span class="tl-card">
          <span class="tl-meta"><span class="tl-cat">${t(CAT_KEY[e.c])}</span>${e.uni ? `<span class="tl-uni">${t("catUni")}</span>` : ""}${e.win ? `<span class="tl-win">🏆</span>` : ""}</span>
          <span class="tl-ttl">${esc(L(e.t))}</span>
          ${e.p ? `<span class="tl-pl">${esc(L(e.p))}</span>` : ""}
          ${evThumb(e)}
        </span>
        ${top ? `<span class="tl-num">${e.d.slice(5,7)}<br>${e.d.slice(8,10)}</span>` : ""}
      </button>`;
    x += COL;
  });
  const W = x + 220;
  const band = todayX === null ? `<div class="tl-band" style="width:${W}px"></div>`
    : `<div class="tl-band" style="width:${todayX}px"></div><div class="tl-band up" style="left:${todayX}px;width:${W-todayX}px"></div>`;
  $("#tlInner").style.width = W + "px";
  $("#tlInner").style.height = H + "px";
  $("#tlInner").innerHTML = band + html;
  $("#tlInner").querySelectorAll("[data-ev]").forEach(b => b.onclick = ev => { if(dragMoved) { ev.preventDefault(); return; } openEvent(Number(b.dataset.ev)); });

  // where to land
  if((tlFirst || tlScrollKeep === "today") && tl.clientWidth > 0){
    const tx = todayX !== null ? todayX : W;
    tl.scrollLeft = Math.max(0, tx - tl.clientWidth * 0.7);
    tlFirst = false;
  } else if(keep !== null) tl.scrollLeft = keep;
  tlScrollKeep = null;
  renderTlNav();
}
function activeMark(){
  const tl = $("#tl"); const pos = tl.scrollLeft + 90;
  let cur = tlMarks[0];
  tlMarks.forEach(m => { if(m.x <= pos) cur = m; });
  return cur;
}
function renderTlNav(){
  const cur = activeMark() || {};
  const years = tlMarks.filter(m => !m.month && m.key !== "up");
  const hasUp = tlMarks.some(m => m.key === "up");
  const activeYear = cur.year;
  $("#tlYears").innerHTML = years.map(m => `<button class="yr ${activeYear===m.key?"on":""}" data-x="${m.x}">${m.key.slice(2)}</button>`).join("")
    + (hasUp ? `<button class="yr up ${activeYear==="up"?"on":""}" data-x="${tlMarks.find(m=>m.key==="up").x}">${t("upcoming")}</button>` : "");
  const yr = activeYear === "up" ? (tlMarks.filter(m => m.month && m.up).map(m => m.year)[0]) : activeYear;
  const months = tlMarks.filter(m => m.month && m.year === yr && (activeYear === "up" ? m.up : true));
  $("#tlMonths").innerHTML = months.map(m => `<button class="mo ${cur.key===m.key?"on":""}" data-x="${m.x}">${esc(monthShort(m.key))}</button>`).join("");
  document.querySelectorAll("#tlYears [data-x], #tlMonths [data-x]").forEach(b => b.onclick = () => $("#tl").scrollTo({left: Math.max(0, Number(b.dataset.x) - 40), behavior:"smooth"}));
}
let dragMoved = false;
function setupTlInput(){
  const tl = $("#tl");
  let down = false, sx = 0, sl = 0;
  tl.addEventListener("pointerdown", e => { if(e.pointerType !== "mouse") return; down = true; dragMoved = false; sx = e.clientX; sl = tl.scrollLeft; });
  window.addEventListener("pointermove", e => { if(!down) return; const dx = e.clientX - sx; if(Math.abs(dx) > 5){ dragMoved = true; tl.classList.add("dragging"); } tl.scrollLeft = sl - dx; });
  window.addEventListener("pointerup", () => { if(!down) return; down = false; tl.classList.remove("dragging"); setTimeout(() => dragMoved = false, 0); });
  tl.addEventListener("wheel", e => { if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ tl.scrollLeft += e.deltaY; e.preventDefault(); } }, {passive:false});
  let raf = 0;
  tl.addEventListener("scroll", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(renderTlNav); });
  document.querySelector(".tl-arrow.l").onclick = () => tl.scrollBy({left: -tl.clientWidth * 0.8, behavior:"smooth"});
  document.querySelector(".tl-arrow.r").onclick = () => tl.scrollBy({left: tl.clientWidth * 0.8, behavior:"smooth"});
  tl.addEventListener("keydown", e => { if(e.key === "ArrowRight") tl.scrollBy({left: 300, behavior:"smooth"}); if(e.key === "ArrowLeft") tl.scrollBy({left: -300, behavior:"smooth"}); });
}

    <div class="body">
      <div class="box">
        <h4>${t("videos")}</h4>
        <div class="row">
          <a class="pill" href="${yt(base)}" target="_blank" rel="noopener">${t("everyone")} ↗</a>
          ${MEMBERS.map(m => `<a class="pill" href="${yt(e.c === "broadcast" ? `${code} 리센느 ${m.name.ko} ${e.kw}` : `${code} 리센느 ${m.name.ko} 직캠 ${e.kw}`)}" target="_blank" rel="noopener"><span class="dot" style="background:${m.color}"></span>${esc(memberName(m))} ↗</a>`).join("")}
        </div>

      <div class="box">
        <h4>${t("fanX")}</h4>
        <div class="row"><a class="pill" href="${xs(base)}" target="_blank" rel="noopener">𝕏 ${t("xSearch")} ↗</a></div>
        ${hms.length ? `<div class="hm">${hms.map((h, k) => { const m = memById(h.m); return `<span class="hm-item"><a class="pill sm" href="${xs(`from:${h.h} since:${e.d} until:${until}`)}" target="_blank" rel="noopener">${m ? `<span class="dot" style="background:${m.color}"></span>` : ""}@${esc(h.h)}${m ? ` · ${esc(memberName(m))}` : ""} ↗</a>${canEditHm ? `<button class="hm-del" data-del="${k}" aria-label="remove">×</button>` : ""}</span>`; }).join("")}</div>
          <p class="note" style="margin:8px 0 0">${t("hmHint")}</p>` : `<p class="note" style="margin:10px 0 0">${t("hmNone")}</p>`}
        ${canEditHm ? `<form class="hm-form" id="hmForm">

  $("#modal").classList.add("on");

  const f = $("#hmForm");

  $("#sheet").querySelectorAll("[data-del]").forEach(b => b.onclick = () => saveHm(hmItems.filter((_, k) => k !== Number(b.dataset.del))));

async function saveHm(items){
  if(!db) return;
  try { await db.doc("homemasters/list").set({items}); hmItems = items; } catch(e){}
  if(openEv !== null && $("#modal").classList.contains("on")) openEvent(openEv);
}
function watchHm(){
  db.doc("homemasters/list").onSnapshot(s => {
    const v = s.exists ? s.data() : null;
    hmItems = v && Array.isArray(v.items) ? v.items.filter(x => x && typeof x.h === "string").map(x => ({h:x.h, m:typeof x.m === "string" ? x.m : ""})) : [];
    if(openEv !== null && $("#modal").classList.contains("on")) openEvent(openEv);
  }, () => {});
}

/* ================= scent & voting ================= */
let scentAlbum = "pulse";
let db = null, me = null, canVote = false, writing = false;
let votesDocs = [], nomDocs = [], myVote = {}, myNoms = [];
let statusKey = "vLoading";
const scentAlbums = () => RELEASES.filter(r => r.scent);

function candidatesFor(album){
  const cur = (CURATED[album] || []).map(c => ({id:c.id, brand:c.brand, name:c.name, notes:(LANG==="ko" ? c.notes.ko : c.notes.en), why:L(c.why), curated:true}));
  const noms = [];
  nomDocs.forEach(d => (d.items || []).forEach(n => {
    if(n && n.album === album && n.id && n.brand && n.name) noms.push({id:String(n.id), brand:String(n.brand).slice(0,40), name:String(n.name).slice(0,60),
      notes:String(n.notes||"").split(",").map(s => s.trim()).filter(Boolean).slice(0,6), why:String(n.why||"").slice(0,120), curated:false});
  }));
  return cur.concat(noms);
}
function tally(album){
  const counts = {}, memos = {};
  votesDocs.forEach(d => {
    const v = d.picks && d.picks[album];
    if(typeof v !== "string") return;
    counts[v] = (counts[v] || 0) + 1;
    const m = d.memos && d.memos[album];
    if(typeof m === "string" && m.trim()) (memos[v] = memos[v] || []).push(m.trim().slice(0,80));
  });
  return {counts, memos};
}
function setStatus(k){ statusKey = k; $("#vstatus").textContent = t(k); }

function renderScent(){
  const albums = scentAlbums();
  if(!albums.some(r => r.id === scentAlbum)) scentAlbum = "pulse";
  $("#scentAlbums").innerHTML = albums.map(r => `<button class="pill ${r.id===scentAlbum?"on":""}" data-a="${r.id}">${esc(r.title)}</button>`).join("");
  $("#scentAlbums").querySelectorAll("[data-a]").forEach(b => b.onclick = () => { scentAlbum = b.dataset.a; renderScent(); });
  const r = relById(scentAlbum);
  $("#scentHead").innerHTML = `<div class="shead">${coverHTML(r)}
      <div><div class="lbl">${esc(L(r.kind))} · ${fmt(r.date)}</div><div class="nm">${esc(r.title)}</div>
      <div style="margin-top:8px"><span class="chip"><span class="dot" style="background:${r.color}"></span>${esc(L(r.scent))}</span></div>
      <p>${esc(L(r.desc))}</p></div></div>`;
  $("#vstatus").textContent = t(statusKey);

  const cands = candidatesFor(scentAlbum);
  const {counts, memos} = tally(scentAlbum);
  const total = Object.values(counts).reduce((a,b) => a+b, 0);
  cands.forEach(c => c.n = counts[c.id] || 0);
  cands.sort((a,b) => b.n - a.n || (b.curated - a.curated));
  const mine = myVote.picks ? myVote.picks[scentAlbum] : null;
  const top = cands.length && cands[0].n ? cands[0].n : 0;
  $("#cands").innerHTML = cands.length ? cands.map((c, i) => {
    const pct = total ? Math.round(c.n / total * 100) : 0;
    const isMine = mine === c.id;
    return `<div class="cand ${isMine ? "mine" : ""}" style="--tint:${r.color}">
      <div class="bar" style="width:${pct}%"></div>
      <div class="tp">
        <div class="rank">${c.n && c.n === top ? "♛" : i + 1}</div>
        <div class="info">
          <div class="br">${esc(c.brand)}</div><div class="pn">${esc(c.name)}</div>
          ${c.notes.length ? `<div class="notes">${c.notes.map(n => `<span>${esc(n)}</span>`).join("")}</div>` : ""}
          ${c.why ? `<div class="why">${esc(c.why)}</div>` : ""}
          ${c.curated ? "" : `<div class="by">${t("fanPick")}</div>`}
          ${(memos[c.id] || []).length ? `<div class="memos">${memos[c.id].slice(0,3).map(m => `<q>${esc(m)}</q>`).join("")}</div>` : ""}
          ${isMine ? `<div class="memo"><input type="text" maxlength="80" id="memoIn" placeholder="${esc(t("memoPh"))}" value="${esc((myVote.memos||{})[scentAlbum] || "")}"><button class="vote" id="memoSave">${t("memoSave")}</button></div>` : ""}
        </div>
        <div class="side">
          <div class="cnt">${c.n}</div><div class="pct">${total ? pct + "%" : t("votes")}</div>
          <button class="vote ${isMine ? "on" : ""}" data-v="${esc(c.id)}" ${canVote ? "" : "disabled"}>${isMine ? t("myPick") : t("pick")}</button>
        </div>
      </div></div>`;
  }).join("") : `<div class="note" style="padding:24px 4px">${t("noCands")}</div>`;
  $("#cands").querySelectorAll("[data-v]").forEach(b => b.onclick = () => castVote(b.dataset.v));
  const ms = $("#memoSave");
  if(ms) ms.onclick = () => saveMemo($("#memoIn").value);
  $("#nomForm").querySelector("button").disabled = !canVote;
}
async function writeMyVote(next){
  if(!db || !me || writing) return;
  writing = true;
  try { await db.doc("votes/" + me).set(next); myVote = next; }
  catch(e){ voteError(e); }
  finally { writing = false; renderScent(); }
}
function castVote(cid){
  const picks = {...(myVote.picks || {})}, memos = {...(myVote.memos || {})};
  if(picks[scentAlbum] === cid){ delete picks[scentAlbum]; delete memos[scentAlbum]; }
  else { delete memos[scentAlbum]; picks[scentAlbum] = cid; }
  writeMyVote({picks, memos, at: Date.now()});
}
function saveMemo(text){
  const memos = {...(myVote.memos || {})};
  const s = String(text || "").trim().slice(0,80);
  if(s) memos[scentAlbum] = s; else delete memos[scentAlbum];
  writeMyVote({picks: {...(myVote.picks || {})}, memos, at: Date.now()});
}
$("#nomForm").onsubmit = async e => {
  e.preventDefault();
  if(!db || !me || writing) return;
  const item = {id:"n-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6), album: scentAlbum,
    brand:$("#nBrand").value.trim(), name:$("#nName").value.trim(), notes:$("#nNotes").value.trim(), why:$("#nWhy").value.trim(), at:Date.now()};
  if(!item.brand || !item.name) return;
  const norm = s => s.replace(/\s/g,"").toLowerCase();
  if(candidatesFor(scentAlbum).some(c => norm(c.brand + c.name) === norm(item.brand + item.name))){ $("#nomMsg").textContent = t("nomDup"); return; }
  const next = [...myNoms, item].slice(-30);
  writing = true;
  try { await db.doc("nominations/" + me).set({items: next}); myNoms = next; $("#nomForm").reset(); $("#nomMsg").textContent = t("nomOk"); }
  catch(err){ voteError(err); }
  finally { writing = false; renderScent(); }
};
function voteError(e){
  const code = e && e.code;
  if(code === "invalid_argument" || code === "not_granted" || code === "revoked"){ canVote = false; setStatus("vDenied"); }
  else if(code === "quota_exceeded") setStatus("vFull");
  else setStatus("vRetry");
}
let assets = null, coverDocs = {};
async function uploadCover(albumId, file){
  if(!assets || !db) return;
  const msg = $("#upMsg"); if(msg) msg.textContent = t("coverBusy");
  try {
    const res = await assets.upload(file);
    const prev = coverDocs[albumId];
    await db.doc("covers/" + albumId).set({id: res.id, at: Date.now()});
    if(prev && prev.id && prev.id !== res.id){ try { await assets.delete(prev.id); } catch(e){} }
  } catch(e){ if(msg) msg.textContent = t("coverFail"); }
}
async function removeCover(albumId){
  if(!assets || !db) return;
  const prev = coverDocs[albumId];
  try { await db.doc("covers/" + albumId).delete(); if(prev && prev.id){ try { await assets.delete(prev.id); } catch(e){} } } catch(e){}
}
function watchCovers(){
  db.collection("covers").onSnapshot(snap => {
    coverDocs = {}; covers = {};
    snap.docs.filter(d => d.exists).forEach(d => {
      const v = d.data();
      if(v && typeof v.id === "string" && /^[A-Za-z0-9_.:@+~-]+$/.test(v.id)){ coverDocs[d.id] = v; covers[d.id] = "/_blob/" + v.id; }
    });
    renderAlbums(); renderScent(); renderSchedule();
    if($("#modal").classList.contains("on")){ if(openId) openAlbum(openId, true); else if(openEv !== null) openEvent(openEv); }
  }, () => {});
}
async function initVoting(){
  setStatus("vLoading");
  let user = null;
  try { [db, user] = await Promise.all([window.claude ? claude.use("db") : null, window.claude ? claude.use("user") : null]); } catch(e){ db = null; }
  if(!db){ setStatus("vNoDb"); renderScent(); return; }
  try { assets = await claude.use("assets"); } catch(e){ assets = null; }
  try { canEditHm = !!(user && await user.canEdit()); } catch(e){ canEditHm = false; }
  watchCovers(); watchHm();
  try { me = user ? await user.id() : null; } catch(e){ me = null; }
  let allowed = null;
  try { allowed = user ? await user.can("data.write") : null; } catch(e){}
  canVote = !!me && allowed !== false;
  let loaded = 0, v1 = false, v2 = false;
  const timer = setTimeout(() => { if(loaded < 2) setStatus("vSlow"); }, 10000);
  const ready = () => { if(++loaded === 2){ clearTimeout(timer); setStatus(canVote ? "vReady" : "vReadOnly"); } };
  db.collection("votes").onSnapshot(snap => {
    votesDocs = snap.docs.filter(d => d.exists).map(d => ({id:d.id, ...d.data()}));
    const mineDoc = votesDocs.find(d => d.id === me);
    if(mineDoc && !writing) myVote = {picks:{...(mineDoc.picks||{})}, memos:{...(mineDoc.memos||{})}};
    if(!snap.metadata.fromCache && !v1){ v1 = true; ready(); }
    renderScent();
  }, () => { clearTimeout(timer); setStatus("vFail"); });
  db.collection("nominations").onSnapshot(snap => {
    nomDocs = snap.docs.filter(d => d.exists).map(d => ({id:d.id, ...d.data()}));
    const mineDoc = nomDocs.find(d => d.id === me);
    if(mineDoc && !writing) myNoms = Array.isArray(mineDoc.items) ? mineDoc.items.slice() : [];
    if(!snap.metadata.fromCache && !v2){ v2 = true; ready(); }
    renderScent();
  }, () => {});
  renderScent();
}

/* ================= boot ================= */
function renderStatic(){ document.querySelectorAll("[data-i]").forEach(el => el.textContent = t(el.dataset.i)); }
function renderAll(){
  renderLangMenu(); renderStatic(); renderTabs(); renderAlbums(); renderSchedule(); renderMembers(); renderScent();
  if($("#modal").classList.contains("on") && openId) openAlbum(openId, true);
}
setupTlInput();
document.documentElement.lang = LANG;
showTab(location.hash.slice(1));
renderAll();
initVoting();
</script>
